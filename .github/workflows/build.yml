name: Build & Test LumeTime APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare APK outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/LumeTime.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/LumeTime-debug.apk
          ls -lh dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumeTime-release-apk
          path: dist/LumeTime.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumeTime-debug-apk
          path: dist/LumeTime-debug.apk

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LumeTime-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
